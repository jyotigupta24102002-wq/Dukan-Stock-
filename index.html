<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Dukaan Stock Tracker</title>

  <!-- =====================================================
       PWA
  ====================================================== -->

  <link
    rel="manifest"
    href="manifest.webmanifest"
  >

  <meta
    name="theme-color"
    content="#0d6e5b"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Dukaan Stock"
  >

  <link
    rel="icon"
    href="icon-192.png"
  >

  <link
    rel="apple-touch-icon"
    href="icon-192.png"
  >


  <!-- =====================================================
       BOOTSTRAP
  ====================================================== -->

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >


  <!-- =====================================================
       APP CSS
  ====================================================== -->

  <link
    rel="stylesheet"
    href="css/variables.css"
  >

  <link
    rel="stylesheet"
    href="css/theme.css"
  >

  <link
    rel="stylesheet"
    href="css/layout.css"
  >

  <link
    rel="stylesheet"
    href="css/components.css"
  >

  <link
    rel="stylesheet"
    href="css/responsive.css"
  >

</head>


<body>

  <!-- =====================================================
       APP SHELL
  ====================================================== -->

  <main
    id="appShell"
    class="app-shell"
  >

    <div
      id="app"
      class="app-container"
    >

      <!-- =================================================
           INITIAL LOADING SCREEN

           This is displayed while app.js initializes.
      ================================================== -->

      <div
        id="appLoader"
        class="app-loader"
      >

        <div class="app-loader-card">

          <div class="app-loader-logo">
            D
          </div>

          <div class="app-loader-text">

            <strong>
              Dukaan Stock
            </strong>

            <span>
              Loading your dashboard...
            </span>

          </div>

          <div
            class="app-loader-spinner"
            aria-hidden="true"
          ></div>

        </div>

      </div>

    </div>

  </main>


  <!-- =====================================================
       BOTTOM NAVIGATION

       Hidden initially through CSS.
       app.js will add .app-ready to body.
  ====================================================== -->
<nav
  id="bottomNav"
  class="app-bottom-nav"
  aria-label="Main navigation"
  style="display: none;"
>

    <button
      type="button"
      data-t="home"
      class="nav-item"
      aria-label="Home"
    >

      <span
        class="nav-icon"
        aria-hidden="true"
      >
        ⌂
      </span>

      <span>
        Home
      </span>

    </button>


    <button
      type="button"
      data-t="stock"
      class="nav-item"
      aria-label="Stock"
    >

      <span
        class="nav-icon"
        aria-hidden="true"
      >
        ▦
      </span>

      <span>
        Stock
      </span>

    </button>


    <button
      type="button"
      data-t="hist"
      class="nav-item"
      aria-label="Hisaab"
    >

      <span
        class="nav-icon"
        aria-hidden="true"
      >
        ≡
      </span>

      <span>
        Hisaab
      </span>

    </button>

  </nav>


  <!-- =====================================================
       MODAL / BOTTOM SHEET
  ====================================================== -->

  <div
    id="modal"
    class="app-modal"
    aria-hidden="true"
  >

    <div
      id="sheet"
      class="sheet"
    ></div>

  </div>


  <!-- =====================================================
       BRAND DATAlIST
  ====================================================== -->

  <datalist id="brands"></datalist>


  <!-- =====================================================
       TOAST
  ====================================================== -->

  <div
    id="toast"
    class="app-toast"
    role="status"
    aria-live="polite"
  ></div>


  <!-- =====================================================
       FIREBASE
  ====================================================== -->

  <script
    src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"
  ></script>

  <script
    src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"
  ></script>

  <script
    src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"
  ></script>


  <!-- =====================================================
       YOUR EXISTING FIREBASE CONFIG

       IMPORTANT:
       Keep your actual firebase-config.js.
  ====================================================== -->

  <script src="firebase-config.js"></script>


  <!-- =====================================================
       BOOTSTRAP JS
  ====================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>


  <!-- =====================================================
       APP JAVASCRIPT

       ?v=3 forces browser to fetch the latest version
       instead of using an old cached app.js.
  ====================================================== -->

  <script
    type="module"
    src="js/app.js?v=3"
  ></script>

</body>

</html>
